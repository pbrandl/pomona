name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            app/package-lock.json

      - name: Contracts – install
        working-directory: contracts
        run: npm ci
      - name: Contracts – test
        working-directory: contracts
        run: npm test

      - name: App – install
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: App – lint
        working-directory: app
        run: npm run lint
      - name: App – test
        working-directory: app
        run: npm test
